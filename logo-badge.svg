    </linearGradient>
    <linearGradient id="gLeaf" x1="300" y1="200" x2="403" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5A9E2F"/><stop offset="1" stop-color="#8BD450"/>
    </linearGradient>
    <path id="spark" d="M0 -14 C2 -4 4 -2 14 0 C4 2 2 4 0 14 C-2 4 -4 2 -14 0 C-4 -2 -2 -4 0 -14 Z"/>
  </defs>

  <!-- Products flying out -->
  <g id="kotlin" transform="rotate(-4 194 150)">
