    <path d="M241 224 C250 236 255 248 256 260"/>
    <path d="M290 220 C280 232 274 246 272 260"/>
    <path d="M262 116 C256 130 254 142 254 154"/>
    <path d="M394 207 C382 214 372 222 364 232"/>
  </g>

  <!-- Sparkles -->
  <g id="sparkles" fill="#FF9900">
    <use href="#spark" transform="translate(94 158)"/>
    <use href="#spark" transform="translate(278 70)"/>
    <use href="#spark" transform="translate(422 192) scale(.8)"/>
  </g>

  <!-- Delivery box -->
  <g id="box" stroke="#E8ECF4" stroke-width="7" stroke-linejoin="round">
    <polygon fill="#E2B57C" points="146,318 258,290 204,240 108,270"/>
    <polygon fill="#E2B57C" points="258,290 366,316 408,267 318,238"/>
    <polygon fill="#6E4A2F" points="146,318 258,290 366,316 272,346"/>
