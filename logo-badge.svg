<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>AWS SDK Kotlin for Spring</title>
  <circle cx="256" cy="256" r="256" fill="#232F3E"/>
  <g transform="translate(256 256) scale(1.05) translate(-258 -263)">
<title>AWS SDK Kotlin for Spring</title>
  <defs>
    <linearGradient id="gKotlin" x1="118" y1="90" x2="270" y2="228" gradientUnits="userSpaceOnUse">
